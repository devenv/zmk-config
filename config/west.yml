manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: beekeeb
      url-base: https://github.com/beekeeb
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
      revision: v0.3
    # Toucan2's battery/BLE-profile RGB status LED widget (rgbled_adapter shield)
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: v0.3
    # Toucan2's multi-touch trackpad (Azoteq TPS43) driver
    - name: zmk_driver_azoteq
      remote: beekeeb
      revision: main
    # Pinch-to-zoom input processor the trackpad's zip_zoom_mapper depends on
    - name: zmk-input-zoom
      remote: beekeeb
      revision: main
  self:
    path: config
