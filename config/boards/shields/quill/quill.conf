# Quill Configuration

# Increase BLE transmit power for better range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable LED indicators
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n

# Enable status LED (blinks on activity)
# Note: XIAO uses built-in LED, configured in overlay

# USB Console Logging (for debugging)
CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BUFFER_SIZE=4096

# Bluetooth debugging
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_DEBUG_LOG=y
CONFIG_BT_HCI_CORE_DEBUG=y

# Increase debounce to prevent stuck keys
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10
